<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="GPU Mode Switch">
  <defs>
    <!-- Deep indigo → teal tile -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="55%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <!-- Soft inner highlight -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Toggle track: production (left) amber-cyan to training (right) teal -->
    <linearGradient id="track" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" ry="52" fill="url(#sheen)"/>

  <!-- Toggle track -->
  <rect x="48" y="108" width="160" height="40" rx="20" ry="20" fill="url(#track)" opacity="0.95" filter="url(#softShadow)"/>

  <!-- Toggle knob (centered = mode-switch identity) -->
  <circle cx="128" cy="128" r="26" fill="#FFFFFF" filter="url(#softShadow)"/>
  <circle cx="128" cy="128" r="18" fill="#EEF2FF"/>
  <!-- Small dual-dot on knob suggesting A/B -->
  <circle cx="120" cy="128" r="3.5" fill="#4338CA"/>
  <circle cx="136" cy="128" r="3.5" fill="#0D9488"/>

  <!-- Left: Production — lightning bolt (chat/serve) -->
  <g transform="translate(68, 58)" fill="#FFFFFF" opacity="0.95">
    <path d="M22 0 L8 22 H18 L10 44 L34 18 H22 L30 0 Z"/>
  </g>

  <!-- Right: Training — simplified brain/gear hybrid -->
  <g transform="translate(166, 54)" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Gear ring -->
    <circle cx="22" cy="22" r="11"/>
    <circle cx="22" cy="22" r="4.5" fill="#FFFFFF" stroke="none"/>
    <!-- Gear teeth (8) -->
    <line x1="22" y1="5" x2="22" y2="0"/>
    <line x1="22" y1="39" x2="22" y2="44"/>
    <line x1="5" y1="22" x2="0" y2="22"/>
    <line x1="39" y1="22" x2="44" y2="22"/>
    <line x1="10" y1="10" x2="6.5" y2="6.5"/>
    <line x1="34" y1="34" x2="37.5" y2="37.5"/>
    <line x1="34" y1="10" x2="37.5" y2="6.5"/>
    <line x1="10" y1="34" x2="6.5" y2="37.5"/>
  </g>

  <!-- Subtle bottom label dots: Prod | Train -->
  <circle cx="88" cy="188" r="4" fill="#67E8F9" opacity="0.85"/>
  <circle cx="168" cy="188" r="4" fill="#5EEAD4" opacity="0.85"/>
  <rect x="100" y="186" width="56" height="4" rx="2" fill="#FFFFFF" opacity="0.35"/>
</svg>
