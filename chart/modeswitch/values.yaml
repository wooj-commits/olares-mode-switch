image:
  repository: ghcr.io/wooj-commits/olares-mode-switch
  tag: "0.1.1"
  pullPolicy: IfNotPresent

workloads:
  modeswitch:
    replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

env:
  PROD_APP: "llamacppqwen3627bggufv3"
  TRAIN_APP: "unsloth"
  GPU_NODE: "olares"
  GPU_DEVICE: ""
  PROD_VRAM_GI: "23"
  TRAIN_VRAM_GI: "22"
  PRODUCTION_ENSURE_RUNNING: "llamacppqwen3627bggufv3,router,embeddinggemmav3,kbmcp"
  TRAINING_ENSURE_RUNNING: "unsloth,router,embeddinggemmav3,kbmcp"
  WATCH_TIMEOUT: "15m"
  LOG_LEVEL: "INFO"
  MODE_DATA_DIR: "/app/data"
