apiVersion: apps/v1
kind: Deployment
metadata:
  name: modeswitch
  namespace: '{{ .Release.Namespace }}'
  labels:
    app: modeswitch
spec:
  replicas: {{ .Values.workloads.modeswitch.replicaCount }}
  selector:
    matchLabels:
      app: modeswitch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: modeswitch
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: init-permissions
        image: docker.io/beclab/aboveos-busybox:1.37.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        command:
        - sh
        - -ec
        - |
          mkdir -p /app/data
          chown -R 1000:1000 /app/data
        volumeMounts:
        - name: data
          mountPath: /app/data
      containers:
      - name: modeswitch
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        {{- $oe := .Values.olaresEnv | default dict }}
        - name: PROD_APP
          value: {{ index $oe "PROD_APP" | default .Values.env.PROD_APP | quote }}
        - name: TRAIN_APP
          value: {{ index $oe "TRAIN_APP" | default .Values.env.TRAIN_APP | quote }}
        - name: GPU_NODE
          value: {{ index $oe "GPU_NODE" | default .Values.env.GPU_NODE | quote }}
        - name: GPU_DEVICE
          value: {{ index $oe "GPU_DEVICE" | default .Values.env.GPU_DEVICE | quote }}
        - name: PROD_VRAM_GI
          value: {{ index $oe "PROD_VRAM_GI" | default .Values.env.PROD_VRAM_GI | quote }}
        - name: TRAIN_VRAM_GI
          value: {{ index $oe "TRAIN_VRAM_GI" | default .Values.env.TRAIN_VRAM_GI | quote }}
        - name: PRODUCTION_ENSURE_RUNNING
          value: {{ index $oe "PRODUCTION_ENSURE_RUNNING" | default .Values.env.PRODUCTION_ENSURE_RUNNING | quote }}
        - name: TRAINING_ENSURE_RUNNING
          value: {{ index $oe "TRAINING_ENSURE_RUNNING" | default .Values.env.TRAINING_ENSURE_RUNNING | quote }}
        - name: WATCH_TIMEOUT
          value: {{ .Values.env.WATCH_TIMEOUT | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.env.LOG_LEVEL | quote }}
        - name: MODE_DATA_DIR
          value: {{ .Values.env.MODE_DATA_DIR | quote }}
        - name: OLARES_CLI
          value: /usr/local/bin/olares-cli
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu | quote }}
            memory: {{ .Values.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.resources.limits.cpu | quote }}
            memory: {{ .Values.resources.limits.memory | quote }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        hostPath:
          path: '{{ .Values.userspace.appData }}/modeswitch'
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: modeswitch
  namespace: '{{ .Release.Namespace }}'
spec:
  selector:
    app: modeswitch
  ports:
  - name: http
    port: 8080
    targetPort: 8080
